    <!-- Dynamic Section Routing Script -->
    <script>
      (() => {
        const homeTitle = "Kuvaira | Premium Corporate & Personal Gifting";
        const pages = {
          "": [null, homeTitle],
          "/about": ["about-me-section", "About Us | Kuvaira"],
          "/process": ["process-section", "Our Process | Kuvaira"],
          "/corporate-gifting": ["gallery-section", "Corporate Gifting | Kuvaira"],
          "/portfolio": [null, "Collections | Kuvaira"],
          "/contact": [null, "Contact | Kuvaira"]
        };
        const updatePage = (scroll) => {
          const page = pages[window.location.pathname.replace(/\/$/, "")];
          const section = page && page[0];
          if (section) {
            document.documentElement.dataset.sectionPage = section;
          } else {
            delete document.documentElement.dataset.sectionPage;
          }
          document.title = page ? page[1] : homeTitle;
          const canonical = document.querySelector('link[rel="canonical"]');
          const ogUrl = document.querySelector('meta[property="og:url"]');
          const href = "https://kuvaira.in" + (page ? window.location.pathname : "/");
          if (canonical) canonical.href = href;
          if (ogUrl) ogUrl.content = href;
          if (scroll) window.scrollTo({ top: 0, behavior: "instant" });
        };
        for (const method of ["pushState", "replaceState"]) {
          const original = history[method];
          history[method] = function (...args) {
            const result = original.apply(this, args);
            updatePage(true);
            return result;
          };
        }
        addEventListener("popstate", () => updatePage(true));
        updatePage(false);
      })();
    </script>
